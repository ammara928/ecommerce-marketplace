{% extends 'store/main.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="box-element">

            <h3>Create Account</h3>

            <hr>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>Username</label>

                    <input
                        class="form-control"
                        type="text"
                        name="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        class="form-control"
                        type="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        class="form-control"
                        type="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success btn-block"
                >
                    Create Account
                </button>

            </form>

            <hr>

            <p>
                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
