{% extends 'store/main.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h3>Review {{ product.name }}</h3>

                    <hr>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="form-group">

                            <label>Rating</label>

                            {{ form.rating }}

                        </div>

                        <div class="form-group">

                            <label>Your Review</label>

                            {{ form.comment }}

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Submit Review
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
